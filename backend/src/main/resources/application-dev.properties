# Medical ERP - Development Configuration
# Profile: dev
# Usage: Local development with MySQL

# Database (MySQL local)
spring.datasource.url=jdbc:mysql://localhost:3306/medical_erp_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# JWT - Access token 1 hour, Refresh token 7 days
jwt.secret=${JWT_SECRET:yLj4x1Rw//3zvWM6R7ERZGIZqJ8aSuMXlx3qzkUXdb8=}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# OTP Configuration
otp.max-attempts=3
otp.expiration-minutes=5
otp.resend-seconds=60
otp.ip-max-requests-per-hour=5
otp.max-active-codes-per-email=3
otp.cleanup-interval-ms=300000

# Email (Gmail SMTP — real emails in dev for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=alonsopicho@gmail.com
spring.mail.password=hfmd kuke lhug sepn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Contact notification recipient
app.contact.notification-email=alonsopicho@gmail.com

# File Upload
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.medicalerp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always
