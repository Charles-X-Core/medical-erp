# Medical ERP - Test Configuration (H2 In-Memory)
# Profile: test (for manual testing without MySQL)

spring.application.name=medical-erp
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:medicalerp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway (H2 doesn't support MySQL-specific migration syntax)
spring.flyway.enabled=false

# JWT (use same secret as dev)
jwt.secret=c2VjcmV0LWtleS1mb3ItbWVkaWNhbC1lcnAtc3lzdGVtLTI1Ni1iaXRz
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Lima

# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
