<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Anillo Eco-Tech</title>
<style>
  :root{
    --bg: #050f24;
    --bg2: #071733;
    --green: #4ee08a;
    --cyan: #37e0c8;
    --blue: #2a7dff;
    --blue-bright: #4fa9ff;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    width:100%;
    height:100%;
    background: radial-gradient(120% 120% at 30% 40%, var(--bg2) 0%, var(--bg) 60%, #020814 100%);
    overflow:hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ---------- Fondo de red hexagonal (derecha e izquierda) ---------- */
  .hex-net{
    position:absolute;
    top:0;
    width:45%;
    height:100%;
    opacity:.35;
    pointer-events:none;
  }
  .hex-net.right{ right:0; }
  .hex-net.left{ left:0; transform: scaleX(-1); opacity:.18; }

  /* ---------- Puntos flotantes dispersos ---------- */
  .particle{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, #9fe8ff 0%, rgba(159,232,255,0) 70%);
    box-shadow: 0 0 8px 2px rgba(120,220,255,.8);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }

  /* ---------- Contenedor de los anillos ---------- */
  .ring-wrap{
    position:relative;
    width:min(62vw, 900px);
    aspect-ratio:1/1;
  }

  /* anillo fino de fondo (segundo círculo, apenas visible) */
  .ring-faint{
    position:absolute;
    inset:6%;
    border-radius:50%;
    border:1px solid rgba(90,150,255,.25);
    filter: blur(.3px);
  }

  /* anillo principal brillante con gradiente conic verde -> cian -> azul */
  .ring-glow{
    position:absolute;
    inset:0;
    border-radius:50%;
    padding:2px;
    background: conic-gradient(
      from 200deg,
      rgba(0,0,0,0) 0deg,
      rgba(0,0,0,0) 40deg,
      var(--green) 95deg,
      var(--cyan) 150deg,
      var(--blue) 230deg,
      var(--blue-bright) 300deg,
      rgba(0,0,0,0) 340deg,
      rgba(0,0,0,0) 360deg
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    filter: drop-shadow(0 0 12px rgba(70,180,255,.55))
            drop-shadow(0 0 26px rgba(70,220,180,.35));
  }

  /* brillo extra concentrado en la parte inferior-derecha (punto más luminoso) */
  .hotspot{
    position:absolute;
    width:14%;
    height:14%;
    bottom:6%;
    right:2%;
    background: radial-gradient(circle, rgba(150,220,255,.9) 0%, rgba(80,170,255,0) 70%);
    filter: blur(4px);
    border-radius:50%;
    pointer-events:none;
  }

  /* pequeños nodos brillantes sobre el trazo del anillo */
  .node{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    box-shadow: 0 0 10px 3px currentColor;
  }

  /* ---------- Hojas ---------- */
  .leaf{
    position:absolute;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
    animation: sway 5s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(0deg) translateY(0); }
    50%{ transform: rotate(4deg) translateY(-6px); }
  }

  /* ---------- Texto central opcional ---------- */
  .center-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#dff3ff;
    flex-direction:column;
    gap:.5rem;
  }
  .center-text h1{
    font-size:clamp(1.4rem, 3vw, 2.4rem);
    font-weight:600;
    letter-spacing:2px;
    text-shadow: 0 0 18px rgba(80,190,255,.6);
  }
  .center-text p{
    font-size:.9rem;
    color:#7fb8d9;
    letter-spacing:1px;
  }
</style>
</head>
<body>

  <!-- Partículas dispersas -->
  <div class="particle" style="width:5px;height:5px; top:10%; left:24%; background-color:#ff5c5c; box-shadow:0 0 8px 2px rgba(255,90,90,.8); animation-delay:.2s;"></div>

  <div class="particle" style="width:6px;height:6px; top:46%; left:41%; animation-delay:1.4s;"></div>
  <div class="particle" style="width:5px;height:5px; top:74%; left:38%; animation-delay:.8s;"></div>
  <div class="particle" style="width:6px;height:6px; top:70%; left:53%; animation-delay:1.9s;"></div>
  <div class="particle" style="width:5px;height:5px; top:15%; left:20%; animation-delay:2.1s;"></div>
  <div class="particle" style="width:5px;height:5px; top:60%; left:19%; animation-delay:.9s;"></div>

  <!-- Anillos -->
  <div class="ring-wrap">
    <div class="ring-faint"></div>
    <div class="ring-glow"></div>

    <div class="node" style="top:22%; left:8%; color:#5cff9c;"></div>

    <div class="node" style="top:82%; left:15%; color:#39d6c0;"></div>
    <div class="node" style="top:92%; left:48%; color:#3aa8ff;"></div>
    <div class="node" style="top:8%; left:52%; color:#4fa9ff;"></div>

    <div class="center-text">
      <h1>TU TÍTULO AQUÍ</h1>
      <p>SUBTÍTULO / DESCRIPCIÓN</p>

  </div>

  <!-- Hojas -->
  <svg class="leaf" style="top:22%; left:20%; width:60px;" viewBox="0 0 100 140" style="animation-delay:.2s;">
    <path d="M50 5 C 90 30, 95 90, 50 135 C 5 90, 10 30, 50 5 Z" fill="#3fae56"/>

  <svg class="leaf" style="top:48%; left:32%; width:38px; animation-delay:1s;" viewBox="0 0 100 140">

  <svg class="leaf" style="top:64%; left:18%; width:78px; animation-delay:.6s;" viewBox="0 0 100 140">
